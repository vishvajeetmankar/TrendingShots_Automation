# Repo me is path par rakho:  .github/workflows/daily.yml
name: Ingestion Pipeline

on:
  schedule:
    - cron: "30 2 * * *"    # 08:00 IST
    - cron: "30 5 * * *"    # 11:00 IST
    - cron: "30 8 * * *"    # 14:00 IST
    - cron: "30 11 * * *"   # 17:00 IST
    - cron: "30 14 * * *"   # 20:00 IST
  workflow_dispatch:

concurrency:
  group: ingestion-pipeline
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install ffmpeg + fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Run ingestion pipeline
        id: run_pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: python pipeline.py

      - name: Upload ready-made parts as artifact (for distributor.py)
        if: success() && steps.run_pipeline.outputs.series_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: parts-${{ steps.run_pipeline.outputs.series_id }}
          path: artifact_out/parts/
          retention-days: 30
          compression-level: 0
